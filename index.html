<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0}</style>
<title>English Level Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: one centred exam sheet, 700px wide. Tabs on top, a segmented progress strip grouped in sixes (one group per CEFR band). */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#141B26; --muted:#5A6677; --line:#D5DBE4;
  --accent:#2347D9; --accent-ink:#FFFFFF; --ok:#1E7A4F; --warn:#B4361F; --tint:#E4EAFB;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151D; --surface:#181F2A; --ink:#E8ECF2; --muted:#9AA6B7; --line:#2A3443;
    --accent:#7C95FF; --accent-ink:#0E1430; --ok:#5CC38F; --warn:#FF8C74; --tint:#222C47; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#181F2A; --ink:#E8ECF2; --muted:#9AA6B7; --line:#2A3443;
  --accent:#7C95FF; --accent-ink:#0E1430; --ok:#5CC38F; --warn:#FF8C74; --tint:#222C47; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:.01em}
.brand span{font-family:var(--f-mono);font-weight:500;font-size:.78rem;color:var(--muted);margin-left:8px;letter-spacing:.08em}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,32px);display:flex;flex-direction:column;gap:20px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(2.1rem,7vw,3.2rem);font-weight:700}
.hero p{color:var(--muted);max-width:52ch;margin-top:10px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.fact b{display:block;font-family:var(--f-mono);font-size:1.5rem;font-weight:600}
.fact span{font-size:.85rem;color:var(--muted)}
.rules{margin:0;padding-left:1.2em;color:var(--muted);display:flex;flex-direction:column;gap:4px;font-size:.95rem}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
input[type=text]{font:inherit;font-weight:400;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
.btn{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 22px;cursor:pointer;font-size:1rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.85rem;border-radius:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* test */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.count{font-family:var(--f-mono);font-size:.9rem;color:var(--muted)}
.timer{font-family:var(--f-mono);font-weight:600;font-size:1.5rem;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:10px;padding:2px 12px}
.timer.low{color:var(--warn);border-color:var(--warn)}
.seg{display:flex;gap:2px}
.seg i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.seg i:nth-child(6n){margin-right:5px}
.seg i:last-child{margin-right:0}
.seg i.done{background:var(--accent);opacity:.55}
.seg i.cur{background:var(--accent);opacity:1}
.q{font-family:var(--f-display);font-size:clamp(1.35rem,4.5vw,1.8rem);font-weight:500;line-height:1.25;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;min-width:0}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .key{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.opt:hover{border-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:var(--tint)}
.opt:has(input:checked) .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}

/* result */
.big{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.big .lvl{font-family:var(--f-display);font-weight:700;font-size:clamp(4rem,18vw,7rem);line-height:.9;color:var(--accent)}
.big .lvl.low{font-size:clamp(2rem,9vw,3.2rem);line-height:1.1}
.big p{color:var(--muted);flex:1 1 220px}
.bands{display:flex;flex-direction:column;gap:8px}
.band{display:grid;grid-template-columns:44px 1fr 44px;gap:10px;align-items:center;font-family:var(--f-mono);font-size:.85rem}
.band .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.band .fill{height:100%;background:var(--accent)}
.band .fill.fail{background:var(--muted);opacity:.6}
.band em{font-style:normal;text-align:right;color:var(--muted)}
.note{font-size:.88rem;color:var(--muted)}
.status{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.95rem}
.status.ok{border-color:var(--ok)}
.status.err{border-color:var(--warn)}
.code{font-family:var(--f-mono);font-size:.78rem;word-break:break-all;background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:8px;user-select:all}

/* monitor */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-family:var(--f-mono);font-size:1.4rem;font-weight:600}
.tile span{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font-family:var(--f-mono);font-weight:600;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:1px 8px;font-size:.88rem;white-space:nowrap}
.badge.low{border-color:var(--muted);color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 18px;text-align:center;color:var(--muted)}
.addcode{display:flex;gap:8px;flex-wrap:wrap}
.addcode input{flex:1 1 220px;width:auto;font-family:var(--f-mono);font-size:.85rem}
@media (max-width:480px){.facts{grid-template-columns:1fr}.fact{display:flex;align-items:baseline;gap:12px}}
@media (prefers-reduced-motion:no-preference){.band .fill{transition:width .5s ease}}
</style>

<div class="wrap">
  <div class="top">
    <div class="brand">English Level Check<span>A1 → C2</span></div>
    <div class="tabs" id="tabs" role="tablist" hidden>
      <button class="tab" role="tab" id="tab-test" aria-selected="true">Test</button>
      <button class="tab" role="tab" id="tab-mon" aria-selected="false">Teacher monitor</button>
    </div>
  </div>
  <main id="view"></main>
</div>

<script>
(function(){
var QUESTIONS=[
/* A1 */
{l:0,q:"She ___ a student.",o:["am","is","are","be"],a:1},
{l:0,q:"I ___ twenty years old.",o:["is","are","am","be"],a:2},
{l:0,q:"___ is your name?",o:["Who","Where","What","Which"],a:2},
{l:0,q:"There ___ two books on the table.",o:["is","am","be","are"],a:3},
{l:0,q:"He ___ breakfast at seven o'clock.",o:["have","has","having","haves"],a:1},
{l:0,q:"Tomorrow is Monday. So today is ___.",o:["Tuesday","Friday","Sunday","Wednesday"],a:2},
/* A2 */
{l:1,q:"Yesterday I ___ to the market.",o:["go","gone","going","went"],a:3},
{l:1,q:"My sister is ___ than my brother.",o:["tall","taller","tallest","more tall"],a:1},
{l:1,q:"I ___ TV when you called me.",o:["watch","was watching","am watching","watches"],a:1},
{l:1,q:"How ___ water do you drink every day?",o:["many","more","much","any"],a:2},
{l:1,q:"We ___ to the cinema tonight.",o:["goes","are going","went","going"],a:1},
{l:1,q:"You ___ smoke here. It is forbidden.",o:["don't have to","might not","mustn't","wouldn't"],a:2},
/* B1 */
{l:2,q:"If it rains tomorrow, we ___ at home.",o:["would stay","stayed","will stay","stays"],a:2},
{l:2,q:"I have lived in this city ___ 2015.",o:["for","since","from","during"],a:1},
{l:2,q:"This book ___ by millions of people.",o:["has read","is reading","have read","has been read"],a:3},
{l:2,q:"She asked me where ___.",o:["did I live","I lived","do I live","I had live"],a:1},
{l:2,q:"He is the man ___ car was stolen.",o:["who","which","whose","whom"],a:2},
{l:2,q:"I'm not used ___ up early.",o:["to get","get","to getting","getting"],a:2},
/* B2 */
{l:3,q:"If I ___ harder, I would have passed the exam.",o:["studied","had studied","would study","have studied"],a:1},
{l:3,q:"By this time next year, she ___ her degree.",o:["will finish","finishes","will have finished","has finished"],a:2},
{l:3,q:"I wish I ___ more free time.",o:["have","would have","has had","had"],a:3},
{l:3,q:"He suggested ___ a taxi.",o:["to take","taking","to taking","took"],a:1},
{l:3,q:"___ being tired, she kept working.",o:["Although","Despite","However","Whereas"],a:1},
{l:3,q:"The manager, ___ I spoke yesterday, was very helpful.",o:["who","whose","with whom","which"],a:2},
/* C1 */
{l:4,q:"Hardly ___ the room when the lights went out.",o:["she had entered","did she enter","she entered","had she entered"],a:3},
{l:4,q:"She was ___ to the idea of moving abroad.",o:["reluctant","averse","unwilling","hesitant"],a:1},
{l:4,q:"Not only ___ late, but he also forgot the documents.",o:["did he arrive","he arrived","arrived he","he did arrive"],a:0},
{l:4,q:"It's high time we ___ a decision.",o:["make","will make","made","have made"],a:2},
{l:4,q:"Had it not been for your help, I ___ the deadline.",o:["will miss","would miss","had missed","would have missed"],a:3},
{l:4,q:"He is believed ___ the country last night.",o:["to leave","having left","to be leaving","to have left"],a:3},
/* C2 */
{l:5,q:"She was at pains ___ that the decision was not personal.",o:["stressing","to stress","stressed","to be stress"],a:1},
{l:5,q:"The minister's remarks were deliberately ___, leaving room for several interpretations.",o:["unequivocal","explicit","categorical","equivocal"],a:3},
{l:5,q:"The evidence, ___ compelling, was ultimately ruled inadmissible.",o:["whereas","albeit","whereby","hence"],a:1},
{l:5,q:"The company's sudden collapse was ___ by years of mismanagement.",o:["precluded","prescribed","precipitated","procrastinated"],a:2},
{l:5,q:"Were it not for her ___, the project would have failed.",o:["tenancy","tenor","temerity","tenacity"],a:3},
{l:5,q:"He is a ___ of virtue, yet nobody has ever seen him help anyone.",o:["parody","paragon","parameter","pittance"],a:1}
];
var LEVELS=["A1","A2","B1","B2","C1","C2"];
var DESC={
 "-1":"Starter level. Keep practising the basics and try again soon.",
 0:"Beginner. You handle very simple phrases and everyday words.",
 1:"Elementary. You manage simple, routine exchanges.",
 2:"Intermediate. You deal with most everyday situations and can describe experiences.",
 3:"Upper-intermediate. You follow complex texts and speak with fluency and spontaneity.",
 4:"Advanced. You use English flexibly and precisely for work and study.",
 5:"Proficient. You use English with near-native precision and nuance."
};
var TOTAL=QUESTIONS.length, LIMIT_MS=20*60*1000, PASS=4;
var KEY="elc-state-v1", MKEY="elc-manual-v1";

var $=function(s){return document.querySelector(s)};
var view=$("#view");
var state=null, tick=null, tab="test";
var db=null, uid=null, isAdmin=false, rows=[], manual=[], dbError="", confirming="";

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function drop(k){try{localStorage.removeItem(k)}catch(e){}}
function mmss(ms){var s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function enc(o){return btoa(String.fromCharCode.apply(null,new TextEncoder().encode(JSON.stringify(o))))}
function dec(c){return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.trim()),function(ch){return ch.charCodeAt(0)})))}
function lvlName(i){return i<0?"Below A1":LEVELS[i]}

/* A level counts when at least 4 of its 6 questions are right and every lower level was passed too. */
function grade(ans){
  var per=[0,0,0,0,0,0];
  QUESTIONS.forEach(function(q,i){if(ans[i]===q.a)per[q.l]++});
  var lvl=-1;
  for(var l=0;l<6;l++){if(per[l]>=PASS)lvl=l;else break}
  return {per:per,lvl:lvl,score:per.reduce(function(a,b){return a+b},0)};
}

/* ---------- intro ---------- */
function renderIntro(){
  clearInterval(tick);
  view.innerHTML='<section class="sheet hero">'+
    '<div><div class="eyebrow">Placement test</div><h1 style="margin-top:10px">Find your English level</h1>'+
    '<p>Questions start easy and get harder. Your result is one of A1, A2, B1, B2, C1 or C2.</p></div>'+
    '<div class="facts"><div class="fact"><b>'+TOTAL+'</b><span>questions</span></div><div class="fact"><b>20:00</b><span>minutes in total</span></div><div class="fact"><b>A1→C2</b><span>easiest to hardest</span></div></div>'+
    '<ul class="rules"><li>One answer per question. You cannot go back.</li><li>You can leave a question empty and move on.</li><li>When the time ends, the test closes by itself.</li></ul>'+
    '<label class="field" for="name">Your full name<input type="text" id="name" maxlength="60" autocomplete="name" placeholder="e.g. Amina Benali"></label>'+
    '<div class="row"><button class="btn" id="start" disabled>Start the test</button></div></section>';
  var n=$("#name"),b=$("#start");
  n.addEventListener("input",function(){b.disabled=n.value.trim().length<2});
  n.addEventListener("keydown",function(e){if(e.key==="Enter"&&!b.disabled)b.click()});
  b.addEventListener("click",function(){
    state={name:n.value.trim(),start:Date.now(),ans:new Array(TOTAL).fill(-1),cur:0,done:false};
    save(KEY,state);render();
  });
}

/* ---------- test ---------- */
function renderTest(){
  var i=state.cur,q=QUESTIONS[i];
  var seg="";for(var k=0;k<TOTAL;k++)seg+='<i class="'+(k===i?'cur':(state.ans[k]>=0?'done':''))+'"></i>';
  var opts=q.o.map(function(t,j){
    return '<label class="opt"><input type="radio" name="q" value="'+j+'"'+(state.ans[i]===j?' checked':'')+'><span class="key">'+"ABCD"[j]+'</span><span>'+esc(t)+'</span></label>';
  }).join("");
  view.innerHTML='<section class="sheet">'+
    '<div class="bar"><div class="count">Question '+(i+1)+' of '+TOTAL+'</div><div class="timer" id="timer" role="timer">'+mmss(state.start+LIMIT_MS-Date.now())+'</div></div>'+
    '<div class="seg" aria-hidden="true">'+seg+'</div>'+
    '<h2 class="q">'+esc(q.q)+'</h2>'+
    '<div class="opts" role="radiogroup" aria-label="Answers">'+opts+'</div>'+
    '<div class="row" style="justify-content:space-between"><span class="note">'+esc(state.name)+'</span><button class="btn" id="next">'+(i===TOTAL-1?'Finish the test':'Next question')+'</button></div></section>';
  view.querySelectorAll("input[name=q]").forEach(function(r){
    r.addEventListener("change",function(){state.ans[i]=+r.value;save(KEY,state);
      view.querySelectorAll(".seg i")[i].className="cur"});
  });
  $("#next").addEventListener("click",function(){
    if(i===TOTAL-1){submit(false)}else{state.cur=i+1;save(KEY,state);renderTest()}
  });
  startTick();
}
function startTick(){
  clearInterval(tick);
  tick=setInterval(function(){
    if(!state||state.done){clearInterval(tick);return}
    var left=state.start+LIMIT_MS-Date.now();
    var t=$("#timer");
    if(t){t.textContent=mmss(left);t.classList.toggle("low",left<=120000)}
    if(left<=0){submit(true)}
  },500);
}

/* ---------- submit + result ---------- */
function submit(timedOut){
  if(state.done)return;
  clearInterval(tick);
  var g=grade(state.ans);
  var used=Math.min(LIMIT_MS,Date.now()-state.start);
  state.done=true;
  state.result={name:state.name,level:lvlName(g.lvl),levelIdx:g.lvl,score:g.score,total:TOTAL,per:g.per,seconds:Math.round(used/1000),timedOut:!!timedOut,at:Date.now()};
  state.sent="pending";
  save(KEY,state);
  renderResult();
  send();
}
async function send(){
  if(state.sent==="yes")return;
  try{
    if(!db)throw new Error("no db");
    if(!uid)throw new Error("no id");
    await db.doc("results/"+uid).set(state.result);
    state.sent="yes";
  }catch(e){state.sent="no"}
  save(KEY,state);
  var s=$("#status");if(s)s.outerHTML=statusHTML();
  bindCopy();
}
function statusHTML(){
  if(state.sent==="yes")return '<div class="status ok" id="status">Your result was sent to your teacher.</div>';
  if(state.sent==="pending")return '<div class="status" id="status">Sending your result to your teacher…</div>';
  return '<div class="status err" id="status">Your result could not be sent automatically. Copy this code and give it to your teacher.'+
    '<div class="code" id="code">'+esc(enc(state.result))+'</div><div class="row" style="margin-top:8px"><button class="btn small" id="copy">Copy code</button></div></div>';
}
function bindCopy(){
  var c=$("#copy");if(!c)return;
  c.addEventListener("click",function(){
    var t=$("#code").textContent;
    var ok=function(){c.textContent="Copied"};
    var fail=function(){var r=document.createRange();r.selectNodeContents($("#code"));var s=getSelection();s.removeAllRanges();s.addRange(r);c.textContent="Selected, press copy"};
    try{navigator.clipboard.writeText(t).then(ok,fail)}catch(e){fail()}
  });
}
function renderResult(){
  clearInterval(tick);
  var r=state.result,low=r.levelIdx<0;
  var bands=LEVELS.map(function(n,i){
    var p=r.per[i],pass=p>=PASS;
    return '<div class="band"><span>'+n+'</span><div class="track"><div class="fill'+(pass?'':' fail')+'" style="width:'+Math.round(p/6*100)+'%"></div></div><em>'+p+'/6</em></div>';
  }).join("");
  view.innerHTML='<section class="sheet">'+
    '<div class="eyebrow">'+esc(r.name)+' · result</div>'+
    '<div class="big"><div class="lvl'+(low?' low':'')+'">'+esc(r.level)+'</div><p>'+esc(DESC[r.levelIdx])+'</p></div>'+
    '<div class="bands" aria-label="Correct answers per level">'+bands+'</div>'+
    '<p class="note">'+r.score+' of '+r.total+' correct in '+mmss(r.seconds*1000)+(r.timedOut?' (time ran out)':'')+'. This is a quick placement estimate, not an official certificate.</p>'+
    statusHTML()+
    '<div class="row"><button class="btn ghost" id="again">Start a new test</button></div></section>';
  bindCopy();
  $("#again").addEventListener("click",function(){drop(KEY);state=null;render()});
}

/* ---------- teacher monitor ---------- */
function allRows(){
  var seen={},out=[];
  rows.concat(manual).forEach(function(r){var k=r.name+"|"+r.at;if(seen[k])return;seen[k]=1;out.push(r)});
  out.sort(function(a,b){return b.at-a.at});
  return out;
}
function renderMonitor(){
  clearInterval(tick);
  var list=allRows();
  var counts={};LEVELS.concat(["Below A1"]).forEach(function(l){counts[l]=0});
  list.forEach(function(r){counts[r.level]=(counts[r.level]||0)+1});
  var tiles=LEVELS.concat(["Below A1"]).map(function(l){return '<div class="tile"><b>'+counts[l]+'</b><span>'+l.toUpperCase()+'</span></div>'}).join("");
  var body=list.length?'<div class="scroll"><table><thead><tr><th>Student</th><th>Level</th><th>Score</th><th>Time</th><th>Date</th><th></th></tr></thead><tbody>'+
    list.map(function(r){
      var id=r.id||("m"+r.at),ask=confirming===id;
      return '<tr><td>'+esc(r.name)+'</td><td><span class="badge'+(r.levelIdx<0?' low':'')+'">'+esc(r.level)+'</span></td>'+
        '<td class="num">'+r.score+'/'+r.total+'</td><td class="num">'+mmss(r.seconds*1000)+(r.timedOut?' (timed out)':'')+'</td>'+
        '<td class="num">'+new Date(r.at).toLocaleString([],{dateStyle:"short",timeStyle:"short"})+'</td>'+
        '<td><button class="btn ghost small" data-del="'+esc(id)+'">'+(ask?'Confirm remove':'Remove')+'</button></td></tr>';
    }).join("")+'</tbody></table></div>':
    '<div class="empty">No results yet. They appear here as soon as a student finishes the test.</div>';
  view.innerHTML='<section class="sheet"><div><div class="eyebrow">Teacher monitor</div><h2 style="margin-top:8px;font-size:1.8rem">'+list.length+' result'+(list.length===1?'':'s')+'</h2></div>'+
    '<div class="tiles">'+tiles+'</div>'+
    (dbError?'<div class="status err">Live results are unavailable ('+esc(dbError)+'). You can still add result codes below.</div>':'')+
    body+
    '<div><div class="eyebrow" style="margin-bottom:8px">Add a result code</div><div class="addcode"><input type="text" id="codein" placeholder="Paste a code from a student" aria-label="Result code"><button class="btn small" id="addc">Add</button></div><p class="note" id="codemsg" style="margin-top:6px">Only needed when a student sees the "could not be sent" message.</p></div></section>';
  view.querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click",async function(){
      var id=b.getAttribute("data-del");
      if(confirming!==id){confirming=id;renderMonitor();return}
      confirming="";
      if(id.charAt(0)==="m"&&!rows.some(function(r){return r.id===id})){
        manual=manual.filter(function(r){return "m"+r.at!==id});save(MKEY,manual);
      }else{try{await db.doc("results/"+id).delete()}catch(e){}}
      renderMonitor();
    });
  });
  $("#addc").addEventListener("click",function(){
    var m=$("#codemsg");
    try{
      var r=dec($("#codein").value);
      if(!r||typeof r.name!=="string"||typeof r.at!=="number"||typeof r.score!=="number")throw 0;
      manual.push(r);save(MKEY,manual);renderMonitor();
    }catch(e){m.textContent="That code is not valid. Ask the student to copy it again."}
  });
}

/* ---------- routing ---------- */
function render(){
  $("#tab-test").setAttribute("aria-selected",tab==="test");
  $("#tab-mon").setAttribute("aria-selected",tab==="mon");
  if(tab==="mon"&&isAdmin){renderMonitor();return}
  if(!state){renderIntro();return}
  if(state.done){renderResult();if(state.sent!=="yes"&&state.sent!=="pending")send();return}
  if(Date.now()>=state.start+LIMIT_MS){submit(true);return}
  renderTest();
}
$("#tab-test").addEventListener("click",function(){tab="test";render()});
$("#tab-mon").addEventListener("click",function(){tab="mon";render()});

state=load(KEY);
manual=load(MKEY)||[];
render();
if(location.hash==="#teacher"){isAdmin=true;$("#tabs").hidden=false}

/* capabilities: light up when available, the test works without them */
(async function(){
  try{
    if(!window.claude||!window.claude.use)return;
    db=await window.claude.use("db");
    var user=await window.claude.use("user");
    if(user){try{uid=await user.id()}catch(e){uid=null}}
    isAdmin=!!(user&&(await user.canEdit()));
    if(isAdmin){
      $("#tabs").hidden=false;
      if(db){
        db.collection("results").orderBy("at","desc").limit(500).onSnapshot(function(snap){
          rows=snap.docs.map(function(d){var o=d.data();o.id=d.id;return o});
          dbError="";
          if(tab==="mon")renderMonitor();
        },function(e){dbError=e.code||"error";if(tab==="mon")renderMonitor()});
      }else{dbError="not connected"}
    }
    if(state&&state.done&&state.sent==="no"&&db){send()}
  }catch(e){}
})();
})();
</script>
